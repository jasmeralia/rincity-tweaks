name: Python Lint

on:
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/python-lint.yml'
  push:
    branches:
      - master
    paths:
      - '**/*.py'
      - '.github/workflows/python-lint.yml'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.7"
